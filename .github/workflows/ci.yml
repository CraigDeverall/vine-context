name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # A TURN server (coturn) for test/turn.test.ts, where Docker is: the Linux job. The test is skipped elsewhere.
      - if: runner.os == 'Linux'
        run: |
          node scripts/turn-server.mjs start
          echo "VINE_TEST_TURN=127.0.0.1:3478" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js --version
      # Loads the native Relate and node-datachannel builds for this OS.
      - run: node dist/cli.js doctor
      # The installed command, as the plugin starts it (a .cmd shim on Windows).
      - run: npm link
      - run: vine --version
      # The package as npm would publish it, installed into an empty folder.
      - run: node scripts/pack-check.mjs
